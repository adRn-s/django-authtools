name: Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 (LTS)
          - django-version: "5.2"
            python-version: "3.10"
          - django-version: "5.2"
            python-version: "3.11"
          - django-version: "5.2"
            python-version: "3.12"
          - django-version: "5.2"
            python-version: "3.13"
          - django-version: "5.2"
            python-version: "3.14"

          # Django 6.0
          - django-version: "6.0"
            python-version: "3.12"
          - django-version: "6.0"
            python-version: "3.13"
          - django-version: "6.0"
            python-version: "3.14"

          # Django 6.1
          - django-version: "6.1"
            python-version: "3.12"
          - django-version: "6.1"
            python-version: "3.13"
          - django-version: "6.1"
            python-version: "3.14"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip version
      run: python -m pip install -U pip

    - name: Install Django ${{ matrix.django-version }}
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
      run: python -m pip install "Django~=${DJANGO_VERSION}.0"

    - name: Install authtools
      run: python -m pip install -e .

    - name: Run Tests
      run: |
        make test
